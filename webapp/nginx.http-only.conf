# See nginx.https.conf for the reasoning behind this rate limit.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name atlas-chessbot.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        # See nginx.https.conf for why this is a variable instead of a bare proxy_pass,
        # and why the /api/ prefix needs an explicit rewrite because of that.
        # See nginx.https.conf for why set has to come before rewrite ... break.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
