server {
    listen 80;
    server_name atlas-chessbot.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name atlas-chessbot.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/atlas-chessbot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas-chessbot.duckdns.org/privkey.pem;

    location /api/ {
        # A variable target (instead of a bare proxy_pass) makes nginx resolve "backend"
        # lazily per-request via Docker's embedded DNS, rather than once at startup --
        # otherwise nginx refuses to start at all if the backend container isn't fully
        # registered in Docker's DNS yet at the exact moment nginx boots. The tradeoff:
        # a variable target disables proxy_pass's usual automatic /api/ prefix-stripping,
        # so it has to be stripped explicitly instead, before the request is proxied.
        # set must come before rewrite ... break -- break halts all further rewrite-phase
        # directives in this location, so a set placed after it would never run, leaving
        # $backend_upstream uninitialized when proxy_pass tries to use it.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
