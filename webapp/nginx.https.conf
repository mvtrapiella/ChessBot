# Shared across both server blocks below since this whole file is included
# straight into the base image's http {} block. 5 req/s per client IP, with
# a burst of 15 queued instead of dropped -- generous for a real player
# clicking/dragging moves, tight enough to blunt a bot hammering the API on
# a VM that only has this one shared vCPU to give.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name atlas-chessbot.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name atlas-chessbot.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/atlas-chessbot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas-chessbot.duckdns.org/privkey.pem;

    location /api/ {
        # limit_req_status makes throttled requests come back as a plain 429
        # instead of nginx's default 503, so the frontend/a script can tell
        # "you're going too fast" apart from "the server is actually down".
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        # A variable target (instead of a bare proxy_pass) makes nginx resolve "backend"
        # lazily per-request via Docker's embedded DNS, rather than once at startup --
        # otherwise nginx refuses to start at all if the backend container isn't fully
        # registered in Docker's DNS yet at the exact moment nginx boots. The tradeoff:
        # a variable target disables proxy_pass's usual automatic /api/ prefix-stripping,
        # so it has to be stripped explicitly instead, before the request is proxied.
        # set must come before rewrite ... break -- break halts all further rewrite-phase
        # directives in this location, so a set placed after it would never run, leaving
        # $backend_upstream uninitialized when proxy_pass tries to use it.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
