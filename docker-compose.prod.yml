services:
  backend:
    image: ghcr.io/mvtrapiella/chessbot-backend:latest
    # No published ports -- only reachable internally, via the webapp's nginx reverse
    # proxy. CORS no longer needs VIRTUAL_MACHINE_IP either, since browser requests to
    # /api/* are same-origin through nginx now, not a separate host:port.
    restart: unless-stopped

  webapp:
    image: ghcr.io/mvtrapiella/chessbot-webapp:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  certbot-etc:
  certbot-webroot:
