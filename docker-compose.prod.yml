services:
  backend:
    image: ghcr.io/mvtrapiella/chessbot-backend:latest
    # No published ports -- only reachable internally, via the webapp's nginx reverse
    # proxy. CORS no longer needs VIRTUAL_MACHINE_IP either, since browser requests to
    # /api/* are same-origin through nginx now, not a separate host:port.
    restart: unless-stopped

  webapp:
    image: ghcr.io/mvtrapiella/chessbot-webapp:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # This has to stay `entrypoint`, not `command` -- the image's own default ENTRYPOINT
    # is `["certbot"]` with no CMD, and Docker concatenates ENTRYPOINT + command rather
    # than one replacing the other. A `command`-only override would run
    # `certbot /bin/sh -c "..."` (the script passed as literal args *to* certbot) instead
    # of actually executing the script. The tradeoff: a one-off `docker compose run certbot
    # <other-command>` needs an explicit `--entrypoint` override to bypass this (see the
    # certonly bootstrap step in the README/runbook), since overriding entrypoint here
    # means `run`'s command otherwise gets silently appended as unused arguments to this
    # same script instead of replacing it.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

volumes:
  certbot-etc:
  certbot-webroot:
