[package]
name = "web_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
board_backend = { path = "../board_backend" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.0", features = ["cors"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
